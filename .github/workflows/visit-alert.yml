# ══════════════════════════════════════════════════════════════════════════════
#  방문 메일 알림
#  포트폴리오(https://00ny.github.io)에 새 방문이 생기면 네이버 메일로 알려 준다.
#  10분마다 GoatCounter 를 딱 1번 조회해 "직전에 확인한 값"과 비교하는 방식이다.
# ══════════════════════════════════════════════════════════════════════════════
#
#  ▣ 사용자가 직접 해야 하는 일 — 이 파일을 push 하기 전에 끝내는 것을 권합니다
#
#   ① 네이버 메일에서 SMTP 를 켠다
#      네이버 메일 → 오른쪽 위 톱니(환경설정) → POP3/IMAP 설정 →
#      "IMAP/SMTP 사용"을 [사용함] 으로 체크 → 저장
#
#   ② 네이버 2단계 인증을 쓰고 있으면 애플리케이션 비밀번호를 발급한다
#      네이버 → 내정보 → 보안설정 → 2단계 인증 → 애플리케이션 비밀번호 → 발급
#      (2단계 인증을 안 쓰면 네이버 로그인 비밀번호를 그대로 쓰면 됩니다)
#
#   ③ 이 저장소에 Secret 3개를 등록한다
#      GitHub 저장소 → Settings → Secrets and variables → Actions →
#      [New repository secret] 로 아래 3개를 이름 그대로 등록:
#
#        GC_TOKEN   GoatCounter API 토큰
#                   baehyun.goatcounter.com → 우측 상단 User → API → Add token
#                   (권한은 "Read statistics" 하나만 있으면 됩니다)
#        SMTP_USER  네이버 메일 주소 전체.  예) qogus_@naver.com
#                   (아이디만 넣어도 @naver.com 을 자동으로 붙입니다)
#        SMTP_PASS  ②에서 발급한 애플리케이션 비밀번호
#                   (2단계 인증을 안 쓰면 네이버 로그인 비밀번호)
#
#      ⚠ Secret 3개가 없으면 이 워크플로는 "설정 누락"으로 빨간 X 로 실패한다.
#        조용히 성공한 척 넘기지 않는 것이 의도다 — 설정이 빠진 걸 모르고 넘어가면
#        알림이 영영 오지 않는다. 그러니 ①②③ 을 먼저 끝내고 push 하세요.
#        이미 push 했다면 Secret 등록 후 Actions 탭 → 이 워크플로 →
#        [Run workflow] 로 한 번 눌러 정상 동작을 확인하면 됩니다.
#
#  ▣ 알아둘 것
#   · GitHub 예약 실행(cron)은 혼잡하면 5~15분 이상 밀린다. "즉시 알림"이 아니라
#     "10분 근처의 근사치"다. 실행이 밀리거나 건너뛰어도 다음 실행이 그동안의
#     증가분을 한 번에 알려주므로 방문을 놓치지는 않는다.
#   · 하루 기준은 한국 시간(KST) 자정이다. 날짜가 바뀌면 그날 첫 방문부터 다시 센다.
#   · 메일의 숫자는 사이트 전체 페이지(홈 + 프로젝트 문서) 합계다. 관리자 통계
#     화면의 '오늘' 카드는 큰 숫자로 홈만 보여 주므로 두 값이 다를 수 있다.
#   · 공개 저장소라 Actions 사용료는 무료다(퍼블릭 저장소는 실행 시간 무제한).
#   · 예약 실행은 저장소에 60일간 활동이 없으면 GitHub 가 자동으로 멈춘다.
#     그때는 Actions 탭에서 다시 켜면 된다.
#   · 저장소 코드를 내려받지 않는다(checkout 단계 없음). API 조회만 하므로 필요 없다.
#   · GoatCounter 사이트 코드(baehyun)는 공개 페이지에도 실려 있는 공개값이라
#     여기 그대로 적는다. 비밀은 토큰뿐이고 그건 Secret 에 있다.

name: 방문 메일 알림

on:
  schedule:
    # 10분마다. GoatCounter 조회는 1회 실행당 1건이라 요청 한도(초당 4건)와 무관하다.
    - cron: '*/10 * * * *'
  # 손으로 시험 실행할 수 있게 (Actions 탭 → Run workflow)
  workflow_dispatch:

permissions:
  contents: read

# 예약 실행과 수동 실행이 겹치면 둘 다 같은 "직전값"을 읽어 메일이 두 번 갈 수 있다.
# 한 번에 하나만 돌게 묶는다.
concurrency:
  group: visit-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ── 0. 설정 확인 ────────────────────────────────────────────────────────
      # Secret 이 비어 있으면 여기서 명확한 에러로 멈춘다(맨 위 주석 ③).
      - name: 설정 확인 (Secret 3개)
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          miss=""
          [ -n "$GC_TOKEN" ] || miss="$miss GC_TOKEN"
          [ -n "$SMTP_USER" ] || miss="$miss SMTP_USER"
          [ -n "$SMTP_PASS" ] || miss="$miss SMTP_PASS"
          if [ -n "$miss" ]; then
            echo "::error title=Secret 누락::등록되지 않은 Secret:$miss — 저장소 Settings → Secrets and variables → Actions 에서 등록하세요 (이 파일 맨 위 주석 ③)"
            exit 1
          fi
          echo "Secret 3개 확인됨"

      # ── 1. 한국 날짜 ────────────────────────────────────────────────────────
      # 러너는 UTC 로 돈다. 캐시 키와 조회 구간에 쓸 KST 날짜를 여기서 한 번만 구한다.
      #
      # ★ '내일' 도 함께 구한다 — GoatCounter 에 날짜만 주면 그 날짜의 **자정**을 뜻한다.
      #   start=오늘&end=오늘 로 주면 폭이 0인 구간이 되어 **언제나 0**이 돌아온다(실측).
      #   그러면 증가분이 영원히 0이라 메일이 한 통도 오지 않는다. end 는 내일이어야
      #   오늘 하루(00:00~24:00 KST)가 온전히 들어온다.
      #   내일은 오늘 날짜에서 파생시킨다 — 자정을 넘기는 순간 두 값이 어긋나지 않게.
      - name: 한국 날짜 계산
        id: day
        run: |
          kst=$(TZ=Asia/Seoul date +%F)
          next=$(TZ=Asia/Seoul date -d "$kst +1 day" +%F)
          echo "오늘(KST) $kst · 조회 끝 $next"
          {
            echo "kst=$kst"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"

      # ── 2. 직전에 확인한 값 불러오기 ────────────────────────────────────────
      # 캐시는 한 번 저장한 키를 덮어쓸 수 없다. 그래서 저장은 매번 새 키로 하고,
      # 불러올 때 restore-keys 접두사로 "같은 날짜의 가장 최근" 캐시를 집는다.
      # (같은 접두사에 여러 개가 맞으면 GitHub 이 가장 최근 것을 준다)
      # 날짜가 접두사에 있으므로 자정이 지나면 자동으로 못 찾고 = 0 부터 다시 센다.
      - name: 직전 방문 수 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .visit-state
          # 실행마다 다른 키 → 정확히 맞는 캐시는 없다 → 아래 접두사로 넘어간다
          key: visit-${{ steps.day.outputs.kst }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            visit-${{ steps.day.outputs.kst }}-

      # ── 3. 오늘 방문 수 조회 (GoatCounter 호출 1건) ─────────────────────────
      - name: 오늘 방문 수 조회
        id: check
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
          DAY: ${{ steps.day.outputs.kst }}
          NEXT: ${{ steps.day.outputs.next }}
        run: |
          set -euo pipefail
          # GoatCounter 는 start/end 를 사이트 표준시간대(이 사이트는 한국) 기준으로 읽고,
          # 날짜만 주면 그 날짜의 자정을 뜻한다 → 오늘 00:00 ~ 내일 00:00 = 오늘 하루.
          # 실측(2026-07-30): end=오늘 이면 0, end=내일 이면 3 이 나왔고 그 3은 관리자
          # 통계 화면의 '오늘' 값과 같았다. 같은 응답의 total_utc 는 0 이었다 —
          # total 이 한국 시간 기준이라는 증거다(변환 코드가 필요 없다).
          # 사이트 코드(baehyun)는 공개 페이지에도 실려 있는 공개값, 토큰만 Secret.
          res=$(curl -sS --fail-with-body -m 30 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $GC_TOKEN" \
            "https://baehyun.goatcounter.com/api/v0/stats/total?start=$DAY&end=$NEXT")
          now=$(printf '%s' "$res" | jq -er '.total')
          case "$now" in
            '' | *[!0-9]*)
              echo "::error title=응답 해석 실패::GoatCounter 응답에서 방문 수를 읽지 못했습니다"
              exit 1
              ;;
          esac
          prev=0
          if [ -f .visit-state/last ]; then
            prev=$(tr -dc '0-9' < .visit-state/last)
            [ -n "$prev" ] || prev=0
          fi
          diff=$(( now - prev ))
          echo "오늘($DAY) 누적 ${now}건 / 직전 확인 ${prev}건 / 증가 ${diff}건"
          # 다음 실행이 비교할 값. 캐시 저장은 마지막 단계에서 한다(메일이 실패하면 저장 안 함).
          mkdir -p .visit-state
          printf '%s' "$now" > .visit-state/last
          {
            echo "now=$now"
            echo "prev=$prev"
            echo "diff=$diff"
          } >> "$GITHUB_OUTPUT"
          if [ "$diff" -gt 0 ]; then
            echo "mail=true" >> "$GITHUB_OUTPUT"
          else
            echo "mail=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### 오늘 누적 ${now}건 · 증가 ${diff}건" >> "$GITHUB_STEP_SUMMARY"

      # ── 4. 받을 주소 정리 ───────────────────────────────────────────────────
      # SMTP_USER 에 아이디만 넣었어도 동작하게 @naver.com 을 붙여 준다.
      # (네이버는 보내는 주소가 로그인한 계정과 다르면 발송을 거부한다)
      - name: 받을 주소 정리
        id: addr
        if: steps.check.outputs.mail == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          a="$SMTP_USER"
          case "$a" in
            *@*) ;;
            *) a="$a@naver.com" ;;
          esac
          echo "mail=$a" >> "$GITHUB_OUTPUT"

      # ── 5. 메일 발송 ────────────────────────────────────────────────────────
      # 늘어난 게 없으면(diff <= 0) 이 단계는 건너뛴다 → 메일이 쌓이지 않는다.
      - name: 메일 보내기
        if: steps.check.outputs.mail == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.naver.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: 포트폴리오 알림 <${{ steps.addr.outputs.mail }}>
          to: ${{ steps.addr.outputs.mail }}
          subject: "[포트폴리오] 새 방문 ${{ steps.check.outputs.diff }}건 · 오늘 누적 ${{ steps.check.outputs.now }}건"
          body: |
            포트폴리오에 새 방문이 있었습니다.

              새 방문     ${{ steps.check.outputs.diff }}건  (직전 확인 이후)
              오늘 누적   ${{ steps.check.outputs.now }}건  ·  ${{ steps.day.outputs.kst }} (한국 시간 기준)

            누가 어디서 들어왔는지는 관리자 화면의 '방문자 통계'에서 볼 수 있습니다.
            맥에서 관리자를 켠 뒤 http://localhost:3000/analytics
            (유입 출처 · 위치 · 기기 · 시간별 타임라인)

            ─────────────────────────────
            · 위 숫자는 사이트 전체 페이지(홈 + 프로젝트 문서) 합계입니다.
              관리자 통계의 '오늘' 카드는 큰 숫자로 홈만 세므로 값이 다를 수 있습니다.
            · 이 메일은 GitHub Actions 워크플로
              (.github/workflows/visit-alert.yml)가 10분마다 GoatCounter 를
              확인해 자동으로 보냅니다. 예약 실행은 5~15분 밀릴 수 있습니다.

      # ── 6. 확인한 값 저장 ───────────────────────────────────────────────────
      # 메일 발송이 실패하면 이 단계까지 오지 않는다 → 기준값이 갱신되지 않아
      # 다음 실행이 같은 증가분을 다시 알린다(알림이 조용히 사라지지 않는다).
      # 변화가 없을 때(diff == 0)는 저장할 것도 없으므로 캐시를 만들지 않는다.
      # diff < 0(수치가 줄어드는 드문 경우)에는 기준값을 다시 맞춰 둔다.
      - name: 확인한 값 저장
        if: success() && steps.check.outputs.diff != '0' && steps.check.outputs.diff != ''
        uses: actions/cache/save@v4
        with:
          path: .visit-state
          key: visit-${{ steps.day.outputs.kst }}-${{ github.run_id }}-${{ github.run_attempt }}
